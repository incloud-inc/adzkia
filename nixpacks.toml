# Configuration for Coolify Nixpacks builder fallback
[phases.setup]
nixPkgs = [
    "php83",
    "php83Packages.composer",
    "nodejs_20",
    "php83Extensions.pdo_mysql",
    "php83Extensions.pdo_pgsql",
    "php83Extensions.pgsql",
    "php83Extensions.redis",
    "php83Extensions.bcmath",
    "php83Extensions.zip",
    "php83Extensions.intl",
    "php83Extensions.gd",
    "php83Extensions.pcntl"
]

[phases.install]
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan storage:link --force || true; php artisan config:cache || true; php artisan route:cache || true; php artisan view:cache || true; php artisan serve --host=0.0.0.0 --port=80"
